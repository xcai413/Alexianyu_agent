name: Lock Refresh Bootstrap

on:
  push:
    branches:
      - issue-3-db-drivers-migrations
    paths:
      - pyproject.toml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: issue-3-db-drivers-migrations
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10

      - name: Refresh lock
        run: uv lock

      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(deps): refresh uv.lock"
          git push origin HEAD:issue-3-db-drivers-migrations
