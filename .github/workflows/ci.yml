name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy / Phase 0 blocking baseline
        run: >-
          uv run mypy
          --follow-imports=skip
          --disable-error-code=no-untyped-def
          src/xianyu_agent/config.py
          src/xianyu_agent/db/database.py
          src/xianyu_agent/db/models.py
          src/xianyu_agent/application/accounts.py
          src/xianyu_agent/application/web_sessions.py
          src/xianyu_agent/interfaces/web/auth/router.py
          src/xianyu_agent/application/health
          src/xianyu_agent/application/outbox_dispatcher.py
          src/xianyu_agent/application/ports/event_bus.py
          src/xianyu_agent/application/ports/idempotency.py
          src/xianyu_agent/application/ports/outbox.py
          src/xianyu_agent/application/ports/repositories.py
          src/xianyu_agent/application/ports/secret_vault.py
          src/xianyu_agent/application/ports/unit_of_work.py
          src/xianyu_agent/composition.py
          src/xianyu_agent/domain/ai
          src/xianyu_agent/domain/account
          src/xianyu_agent/domain/inventory
          src/xianyu_agent/domain/item
          src/xianyu_agent/domain/message
          src/xianyu_agent/domain/order
          src/xianyu_agent/domain/runtime
          src/xianyu_agent/foundation
          src/xianyu_agent/protocol/ws
          src/xianyu_agent/runtime/account_lock.py
          src/xianyu_agent/runtime/account_pool.py
          src/xianyu_agent/runtime/account_worker.py
          src/xianyu_agent/runtime/daemon.py
          src/xianyu_agent/runtime/daemon_lock.py
          src/xianyu_agent/runtime/heartbeat.py
          src/xianyu_agent/runtime/platform
          src/xianyu_agent/runtime/scheduler
          src/xianyu_agent/runtime/service_runner.py
          src/xianyu_agent/runtime/watchdog.py
          src/xianyu_agent/infrastructure/database/models
          src/xianyu_agent/infrastructure/database/repositories/account.py
          src/xianyu_agent/infrastructure/database/repositories/outbox.py
          src/xianyu_agent/infrastructure/database/scheduler_queue.py
          src/xianyu_agent/infrastructure/database/unit_of_work.py
          src/xianyu_agent/infrastructure/idempotency.py
          src/xianyu_agent/infrastructure/secrets

      - name: Mypy / legacy debt report
        continue-on-error: true
        run: uv run mypy src/xianyu_agent

      - name: Pytest
        run: uv run pytest -q -m "not real_account"

  db-sqlite:
    name: DB / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XIANYU_DATABASE_URL: sqlite+aiosqlite:///./data/ci-sqlite.db
      TEST_DATABASE_BACKEND: sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      - name: Migration schema contract
        run: uv run pytest -q tests/integration/test_migration_schema_backend.py
      - name: Repository contract
        run: uv run pytest -q tests/integration/test_account_repository_backend.py
      - name: Application / UoW contract
        run: uv run pytest -q tests/integration/test_account_application_backend.py
      - name: Transactional outbox contract
        run: uv run pytest -q tests/integration/test_transactional_outbox_backend.py
      - name: Outbox dispatcher contract
        run: uv run pytest -q tests/integration/test_outbox_dispatcher_backend.py
      - name: Scheduler due queue contract
        run: uv run pytest -q tests/integration/test_scheduler_due_queue_backend.py
      - name: Platform automation scheduler contract
        run: uv run pytest -q tests/integration/test_platform_automation_backend.py
      - name: Runtime lease contract
        run: uv run pytest -q tests/integration/test_runtime_lease_backend.py
      - name: Worker command claim contract
        run: uv run pytest -q tests/integration/test_worker_command_claim_backend.py
      - name: SecretVault contract
        run: uv run pytest -q tests/integration/test_secret_vault_backend.py
      - name: Idempotency inbox contract
        run: uv run pytest -q tests/integration/test_idempotency_backend.py
      - name: Inventory reservation contract
        run: uv run pytest -q tests/integration/test_inventory_reservation_backend.py
      - name: Web session revocation contract
        run: uv run pytest -q tests/integration/test_web_session_backend.py
      - name: Database smoke
        run: uv run pytest -q tests/integration/test_database_backend_smoke.py

  container-build:
    name: Container / build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          export XIANYU_FERNET_KEY="$(openssl rand -base64 32 | tr '+/' '-_')"
          docker compose -f compose.yml config -q

      - name: Build image
        run: docker build -t xianyu-agent:ci .

      - name: Container smoke (migrate + doctor + CLI)
        run: |
          docker run --rm \
            -e XIANYU_DATABASE_URL="sqlite+aiosqlite:////tmp/xianyu.db" \
            -e XIANYU_DATA_DIR=/tmp/data \
            -e XIANYU_FERNET_KEY="$(openssl rand -base64 32 | tr '+/' '-_')" \
            xianyu-agent:ci --version

  container-postgres:
    name: Container / Postgres migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: xianyu
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d xianyu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t xianyu-agent:ci .

      # 容器入口会在 Postgres 上跑 alembic upgrade head + doctor;
      # 这条覆盖了「布尔默认值等 SQLite/MySQL 能过、Postgres 拒绝」的迁移回归。
      - name: Migrate + doctor against Postgres
        run: |
          docker run --rm --network host \
            -e XIANYU_DATABASE_URL="postgresql+asyncpg://postgres@127.0.0.1:5432/xianyu" \
            -e XIANYU_DATA_DIR=/tmp/data \
            -e XIANYU_FERNET_KEY="$(openssl rand -base64 32 | tr '+/' '-_')" \
            xianyu-agent:ci doctor --output json

  container-console:
    name: Container / console / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - backend: sqlite
            file: compose.sqlite.yml
          - backend: postgres
            file: compose.yml
    env:
      COMPOSE_FILE: ${{ matrix.file }}
      COMPOSE_PROJECT_NAME: xianyu-console-ci
      XIANYU_IMAGE: xianyu-agent:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t xianyu-agent:ci .
      - name: Prepare synthetic credentials and an empty data directory
        run: |
          umask 077
          test ! -e .env
          docker run --rm -i --entrypoint python xianyu-agent:ci - <<'PY' > .env
          import secrets
          from cryptography.fernet import Fernet
          from xianyu_agent.interfaces.web.auth.security import hash_password
          password = "isolated container administrator password"
          values = {
              "XIANYU_FERNET_KEY": Fernet.generate_key().decode(),
              "POSTGRES_PASSWORD": secrets.token_hex(24),
              "XIANYU_WEB_ADMIN_PASSWORD_HASH": hash_password(password),
              "XIANYU_WEB_SESSION_SECRET": secrets.token_hex(32),
              "XIANYU_SMOKE_ADMIN_PASSWORD": password,
              "XIANYU_AUTOMATION_MODE": "observe",
              "XIANYU_WEB_COOKIE_SECURE": "false",
          }
          for key, value in values.items():
              print(f"{key}='{value}'")
          PY
          mkdir -p data
          docker run --rm --user 0 --entrypoint chown -v "$PWD/data:/data" \
            xianyu-agent:ci 10001:10001 /data
      - name: Verify Web, MCP, revocation and restart
        run: |
          trap 'docker compose --profile console down -v --remove-orphans' EXIT
          docker compose --profile console config -q
          docker compose --profile console up --no-build --wait --wait-timeout 180
          docker compose exec -T web python /app/docker/web_console_smoke.py
          docker compose restart web
          docker compose --profile console up --no-build --wait --wait-timeout 180
          docker compose exec -T web python /app/docker/web_console_smoke.py
          docker compose ps

  multi-replica:
    name: Container / two replicas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start and verify two replicas
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          export XIANYU_FERNET_KEY="$(openssl rand -base64 32 | tr '+/' '-_')"
          trap 'docker compose -f compose.multi.yml down -v --remove-orphans' EXIT
          docker compose -f compose.multi.yml config -q
          docker compose -f compose.multi.yml up -d --build
          verify_replicas() {
            for attempt in $(seq 1 30); do
              if docker compose -f compose.multi.yml exec -T app-a \
                python /app/docker/multi_replica_smoke.py; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          verify_replicas
          docker compose -f compose.multi.yml kill app-b
          docker compose -f compose.multi.yml up -d app-b
          verify_replicas
          docker compose -f compose.multi.yml ps

  db-mysql:
    name: DB / MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: xianyu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      XIANYU_DATABASE_URL: mysql+asyncmy://root@127.0.0.1:3306/xianyu
      TEST_DATABASE_BACKEND: mysql
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      - name: Migration schema contract
        run: uv run pytest -q tests/integration/test_migration_schema_backend.py
      - name: Repository contract
        run: uv run pytest -q tests/integration/test_account_repository_backend.py
      - name: Application / UoW contract
        run: uv run pytest -q tests/integration/test_account_application_backend.py
      - name: Transactional outbox contract
        run: uv run pytest -q tests/integration/test_transactional_outbox_backend.py
      - name: Outbox dispatcher contract
        run: uv run pytest -q tests/integration/test_outbox_dispatcher_backend.py
      - name: Scheduler due queue contract
        run: uv run pytest -q tests/integration/test_scheduler_due_queue_backend.py
      - name: Platform automation scheduler contract
        run: uv run pytest -q tests/integration/test_platform_automation_backend.py
      - name: Runtime lease contract
        run: uv run pytest -q tests/integration/test_runtime_lease_backend.py
      - name: Worker command claim contract
        run: uv run pytest -q tests/integration/test_worker_command_claim_backend.py
      - name: SecretVault contract
        run: uv run pytest -q tests/integration/test_secret_vault_backend.py
      - name: Idempotency inbox contract
        run: uv run pytest -q tests/integration/test_idempotency_backend.py
      - name: Inventory reservation contract
        run: uv run pytest -q tests/integration/test_inventory_reservation_backend.py
      - name: Web session revocation contract
        run: uv run pytest -q tests/integration/test_web_session_backend.py
      - name: Database smoke
        run: uv run pytest -q tests/integration/test_database_backend_smoke.py

  db-postgresql:
    name: DB / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: xianyu
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d xianyu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      XIANYU_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/xianyu
      TEST_DATABASE_BACKEND: postgresql
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      - name: Migration schema contract
        run: uv run pytest -q tests/integration/test_migration_schema_backend.py
      - name: Repository contract
        run: uv run pytest -q tests/integration/test_account_repository_backend.py
      - name: Application / UoW contract
        run: uv run pytest -q tests/integration/test_account_application_backend.py
      - name: Transactional outbox contract
        run: uv run pytest -q tests/integration/test_transactional_outbox_backend.py
      - name: Outbox dispatcher contract
        run: uv run pytest -q tests/integration/test_outbox_dispatcher_backend.py
      - name: Scheduler due queue contract
        run: uv run pytest -q tests/integration/test_scheduler_due_queue_backend.py
      - name: Platform automation scheduler contract
        run: uv run pytest -q tests/integration/test_platform_automation_backend.py
      - name: Runtime lease contract
        run: uv run pytest -q tests/integration/test_runtime_lease_backend.py
      - name: Worker command claim contract
        run: uv run pytest -q tests/integration/test_worker_command_claim_backend.py
      - name: SecretVault contract
        run: uv run pytest -q tests/integration/test_secret_vault_backend.py
      - name: Idempotency inbox contract
        run: uv run pytest -q tests/integration/test_idempotency_backend.py
      - name: Inventory reservation contract
        run: uv run pytest -q tests/integration/test_inventory_reservation_backend.py
      - name: Web session revocation contract
        run: uv run pytest -q tests/integration/test_web_session_backend.py
      - name: Database smoke
        run: uv run pytest -q tests/integration/test_database_backend_smoke.py
