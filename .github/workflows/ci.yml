name: CI

on:
  pull_request:
    branches:
      - main
      - issue-3-phase0-db-foundation
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy / Phase 0 blocking baseline
        run: >-
          uv run mypy
          --follow-imports=skip
          --disable-error-code=no-untyped-def
          src/xianyu_agent/config.py
          src/xianyu_agent/db/database.py

      - name: Mypy / legacy debt report
        continue-on-error: true
        run: uv run mypy src/xianyu_agent

      - name: Pytest
        run: uv run pytest -q -m "not real_account"

  db-sqlite:
    name: DB / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XIANYU_DATABASE_URL: sqlite+aiosqlite:///./data/ci-sqlite.db
      TEST_DATABASE_BACKEND: sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Database smoke
        run: uv run pytest -q tests/integration/test_database_backend_smoke.py

  db-mysql:
    name: DB / MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: xianyu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      XIANYU_DATABASE_URL: mysql+asyncmy://root@127.0.0.1:3306/xianyu
      TEST_DATABASE_BACKEND: mysql
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Install database driver
        run: uv pip install asyncmy

      - name: Database smoke
        run: uv run pytest -q tests/integration/test_database_backend_smoke.py

  db-postgresql:
    name: DB / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: xianyu
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d xianyu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      XIANYU_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/xianyu
      TEST_DATABASE_BACKEND: postgresql
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Install database driver
        run: uv pip install asyncpg

      - name: Database smoke
        run: uv run pytest -q tests/integration/test_database_backend_smoke.py
