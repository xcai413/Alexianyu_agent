name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy / Phase 0 blocking baseline
        run: >-
          uv run mypy
          --follow-imports=skip
          --disable-error-code=no-untyped-def
          src/xianyu_agent/config.py
          src/xianyu_agent/db/database.py
          src/xianyu_agent/db/models.py
          src/xianyu_agent/application/accounts.py
          src/xianyu_agent/application/health
          src/xianyu_agent/application/outbox_dispatcher.py
          src/xianyu_agent/application/ports/event_bus.py
          src/xianyu_agent/application/ports/idempotency.py
          src/xianyu_agent/application/ports/outbox.py
          src/xianyu_agent/application/ports/repositories.py
          src/xianyu_agent/application/ports/secret_vault.py
          src/xianyu_agent/application/ports/unit_of_work.py
          src/xianyu_agent/composition.py
          src/xianyu_agent/domain/account
          src/xianyu_agent/domain/inventory
          src/xianyu_agent/domain/runtime
          src/xianyu_agent/foundation
          src/xianyu_agent/runtime/account_lock.py
          src/xianyu_agent/runtime/account_pool.py
          src/xianyu_agent/runtime/account_worker.py
          src/xianyu_agent/runtime/daemon.py
          src/xianyu_agent/runtime/daemon_lock.py
          src/xianyu_agent/runtime/heartbeat.py
          src/xianyu_agent/runtime/platform
          src/xianyu_agent/runtime/scheduler
          src/xianyu_agent/runtime/service_runner.py
          src/xianyu_agent/runtime/watchdog.py
          src/xianyu_agent/infrastructure/database/models
          src/xianyu_agent/infrastructure/database/repositories/account.py
          src/xianyu_agent/infrastructure/database/repositories/outbox.py
          src/xianyu_agent/infrastructure/database/scheduler_queue.py
          src/xianyu_agent/infrastructure/database/unit_of_work.py
          src/xianyu_agent/infrastructure/idempotency.py
          src/xianyu_agent/infrastructure/secrets

      - name: Mypy / legacy debt report
        continue-on-error: true
        run: uv run mypy src/xianyu_agent

      - name: Pytest
        run: uv run pytest -q -m "not real_account"

  db-sqlite:
    name: DB / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XIANYU_DATABASE_URL: sqlite+aiosqlite:///./data/ci-sqlite.db
      TEST_DATABASE_BACKEND: sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      - name: Repository contract
        run: uv run pytest -q tests/integration/test_account_repository_backend.py
      - name: Application / UoW contract
        run: uv run pytest -q tests/integration/test_account_application_backend.py
      - name: Transactional outbox contract
        run: uv run pytest -q tests/integration/test_transactional_outbox_backend.py
      - name: Outbox dispatcher contract
        run: uv run pytest -q tests/integration/test_outbox_dispatcher_backend.py
      - name: Scheduler due queue contract
        run: uv run pytest -q tests/integration/test_scheduler_due_queue_backend.py
      - name: SecretVault contract
        run: uv run pytest -q tests/integration/test_secret_vault_backend.py
      - name: Idempotency inbox contract
        run: uv run pytest -q tests/integration/test_idempotency_backend.py
      - name: Database smoke
        run: uv run pytest -q tests/integration/test_database_backend_smoke.py

  db-mysql:
    name: DB / MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: xianyu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      XIANYU_DATABASE_URL: mysql+asyncmy://root@127.0.0.1:3306/xianyu
      TEST_DATABASE_BACKEND: mysql
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      - name: Repository contract
        run: uv run pytest -q tests/integration/test_account_repository_backend.py
      - name: Application / UoW contract
        run: uv run pytest -q tests/integration/test_account_application_backend.py
      - name: Transactional outbox contract
        run: uv run pytest -q tests/integration/test_transactional_outbox_backend.py
      - name: Outbox dispatcher contract
        run: uv run pytest -q tests/integration/test_outbox_dispatcher_backend.py
      - name: Scheduler due queue contract
        run: uv run pytest -q tests/integration/test_scheduler_due_queue_backend.py
      - name: SecretVault contract
        run: uv run pytest -q tests/integration/test_secret_vault_backend.py
      - name: Idempotency inbox contract
        run: uv run pytest -q tests/integration/test_idempotency_backend.py
      - name: Database smoke
        run: uv run pytest -q tests/integration/test_database_backend_smoke.py

  db-postgresql:
    name: DB / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: xianyu
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d xianyu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      XIANYU_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/xianyu
      TEST_DATABASE_BACKEND: postgresql
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.10
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Alembic upgrade head
        run: uv run alembic upgrade head
      - name: Repository contract
        run: uv run pytest -q tests/integration/test_account_repository_backend.py
      - name: Application / UoW contract
        run: uv run pytest -q tests/integration/test_account_application_backend.py
      - name: Transactional outbox contract
        run: uv run pytest -q tests/integration/test_transactional_outbox_backend.py
      - name: Outbox dispatcher contract
        run: uv run pytest -q tests/integration/test_outbox_dispatcher_backend.py
      - name: Scheduler due queue contract
        run: uv run pytest -q tests/integration/test_scheduler_due_queue_backend.py
      - name: SecretVault contract
        run: uv run pytest -q tests/integration/test_secret_vault_backend.py
      - name: Idempotency inbox contract
        run: uv run pytest -q tests/integration/test_idempotency_backend.py
      - name: Database smoke
        run: uv run pytest -q tests/integration/test_database_backend_smoke.py
