[project]
name = "xianyu-agent"
version = "0.1.0"
description = "闲鱼运营 Agent 化重构 — 为 AI Agent 直接控制、可持续无人值守运行的轻量化闲鱼运营系统"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "ale" },
]
keywords = ["xianyu", "goofish", "agent", "automation", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncmy>=0.2.9",
    "asyncpg>=0.29.0",
    "pymysql>=1.1.1",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "cryptography>=43.0.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "qrcode[pil]>=7.4.0",
    "apscheduler>=3.10.0",
    "loguru>=0.7.0",
    "textual>=0.79.0",
    "fastapi>=0.115.0",
    "fastapi-mcp>=0.4.0",
    "mcp>=1.12.0,<2.0",
    "msgpack>=1.1.0,<2.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "respx>=0.21.0",
    "freezegun>=1.5.0",
]

[project.scripts]
xianyu-agent = "xianyu_agent.cli.main:app"

[project.urls]
"Homepage" = "https://github.com/yourname/xianyu-agent"
"Issues" = "https://github.com/yourname/xianyu-agent/issues"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xianyu_agent"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "respx>=0.21.0",
    "freezegun>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/versions/*", "data/*", "outputs/*", "scripts/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",
    "B", "C4", "SIM", "UP",
    "N", "RUF",
    "PT", "T20", "Q",
    "RET", "ARG", "ERA",
    "PIE", "PL", "TRY",
    "ASYNC", "PERF", "LOG",
]
ignore = [
    "E501",
    "PLR0913",
    "PLR2004",
    "TRY003",
    "TRY300",
    "RET504",
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101", "PT011", "ARG"]
"src/xianyu_agent/cli/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["xianyu_agent"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_account: tests requiring a real Xianyu account (deselect with '-m \"not real_account\"')",
    "integration: end-to-end integration tests",
    "smoke: smoke tests with real DB/WS",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:botocore.*",
    "ignore::PendingDeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # aiosqlite connection GC after loop teardown (test-harness noise only)
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/xianyu_agent"]
omit = [
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
fail_under = 60
