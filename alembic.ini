# Alembic configuration for xianyu-agent.
# Keep this file pure ASCII; alembic reads with locale encoding (GBK on Windows).
# script_location points to src/xianyu_agent/db/migrations.
# sqlalchemy.url is injected at runtime from xianyu_agent.config.get_settings().

[alembic]
script_location = src/xianyu_agent/db/migrations
prepend_sys_path = src
timezone = Asia/Shanghai
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
